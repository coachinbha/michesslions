<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Map Viewer</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 700;
        }

        .loading, .error {
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.1rem;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .error {
            color: #dc2626;
            border-color: #fecaca;
            background-color: #fef2f2;
        }

        .sitemap-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sitemap-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sitemap-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.04);
            border-color: var(--primary-color);
        }

        .page-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .page-title.fallback {
            color: var(--text-secondary);
            font-style: italic;
            font-weight: 500;
        }

        .page-url {
            font-size: 0.9rem;
            color: var(--primary-color);
            text-decoration: none;
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .page-url:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .meta::before {
            content: "🕒";
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Site Map</h1>
        <div id="sitemap-container" class="loading">Loading sitemap...</div>
    </div>

    <script>
        async function loadSitemap() {
            const container = document.getElementById('sitemap-container');
            
            try {
                // Fetch the sitemap.xml file
                const response = await fetch('sitemap.xml');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const text = await response.text();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");
                
                if (xmlDoc.querySelector("parsererror")) {
                    throw new Error("Invalid XML format in sitemap.xml");
                }

                const urlNodes = Array.from(xmlDoc.querySelectorAll('url'));
                if (urlNodes.length === 0) {
                    container.innerHTML = '<p class="error">No URLs found in sitemap.xml</p>';
                    return;
                }

                container.innerHTML = '<ul class="sitemap-list" id="sitemap-list"></ul>';
                const list = document.getElementById('sitemap-list');

                // Process in batches to avoid overwhelming the browser/network
                const batchSize = 5;
                for (let i = 0; i < urlNodes.length; i += batchSize) {
                    const batch = urlNodes.slice(i, i + batchSize);
                    
                    await Promise.all(batch.map(async (node) => {
                        const loc = node.querySelector('loc')?.textContent || '';
                        const lastmod = node.querySelector('lastmod')?.textContent || '';
                        
                        if (!loc) return;

                        const li = document.createElement('li');
                        li.className = 'sitemap-item';
                        
                        const titleEl = document.createElement('div');
                        titleEl.className = 'page-title';
                        titleEl.textContent = 'Loading title...';
                        
                        const linkEl = document.createElement('a');
                        linkEl.href = loc;
                        linkEl.className = 'page-url';
                        linkEl.textContent = loc;
                        linkEl.target = '_blank';
                        linkEl.rel = 'noopener noreferrer';
                        
                        const metaEl = document.createElement('div');
                        metaEl.className = 'meta';
                        if (lastmod) {
                            try {
                                const date = new Date(lastmod);
                                metaEl.textContent = `Last modified: ${date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}`;
                            } catch (e) {
                                metaEl.textContent = `Last modified: ${lastmod}`;
                            }
                        }

                        li.appendChild(titleEl);
                        li.appendChild(linkEl);
                        if (lastmod) li.appendChild(metaEl);
                        list.appendChild(li);

                        // Try to fetch the actual page to get its <title>
                        try {
                            const pageResponse = await fetch(loc);
                            if (!pageResponse.ok) throw new Error(`HTTP ${pageResponse.status}`);
                            const pageText = await pageResponse.text();
                            const pageParser = new DOMParser();
                            const pageDoc = pageParser.parseFromString(pageText, "text/html");
                            const title = pageDoc.querySelector('title')?.textContent || 'No Title';
                            titleEl.textContent = title.trim();
                        } catch (err) {
                            console.warn(`Could not fetch title for ${loc}:`, err);
                            // Graceful fallback: generate a readable name from the URL
                            titleEl.textContent = generateFallbackTitle(loc);
                            titleEl.classList.add('fallback');
                        }
                    }));
                }
            } catch (error) {
                container.innerHTML = `<p class="error">Error loading sitemap: ${error.message}<br><small>Make sure this HTML file is hosted on the same domain as sitemap.xml to avoid browser CORS restrictions.</small></p>`;
            }
        }

        function generateFallbackTitle(url) {
            try {
                const urlObj = new URL(url);
                const path = urlObj.pathname;
                let name = path.split('/').pop() || 'Home';
                if (name === 'index.html' || name === '') return 'Home';
                // Format: "registration-list-print" -> "Registration List Print"
                return name.replace('.html', '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            } catch (e) {
                return url;
            }
        }

        // Initialize when the DOM is ready
        document.addEventListener('DOMContentLoaded', loadSitemap);
    </script>
</body>
</html>
